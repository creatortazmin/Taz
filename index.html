<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Migratory Bird Facts</title>

  <!-- 🌌 Styling -->
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      background: url('./birds-night-sky.png') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      margin: 0;
      padding: 50px;
    }

    h1 {
      background-color: rgba(0,0,0,0.6);
      padding: 15px;
      border-radius: 8px;
      display: inline-block;
    }

    #fact {
      font-size: 1.2em;
      margin: 20px;
      background-color: rgba(0,0,0,0.5);
      padding: 15px;
      border-radius: 8px;
    }

    button {
      background-color: #45a29e;
      border: none;
      padding: 12px 24px;
      font-size: 1em;
      color: white;
      cursor: pointer;
      border-radius: 6px;
    }

    button:hover {
      background-color: #66fcf1;
      color: #0b0c10;
    }
  </style>
</head>
<body>
  <h1>World Migratory Bird Day 🐦 October 10</h1>
  <div id="fact">Click the button to see a fact!</div>
  <button onclick="showFact()">Show Fact</button>

  <!-- 🐦 Light Pollution Facts -->
  <script>
    const facts = [
      "Pulls them off course: Bright city lights glow so far into the night sky that migrating birds see them from miles away and fly toward the city instead of following their normal path.",
      "Leads to deadly crashes: Night-flying birds get drawn straight to brightly lit buildings and hit glass windows or walls, which often kills them.",
      "Tricks whole flocks into danger: When lost birds panic and chirp in the dark, nearby birds follow the noise—accidentally pulling the whole group toward the bright buildings.",
      "Tires them out to exhaustion: Birds get trapped circling around bright lights, wasting precious fuel and energy they need to finish their journey or escape danger.",
      "Traps seabirds on the ground: Birds like petrels and shearwaters get blinded by land lights, crash-land, and often can't fly back up, leaving them helpless against cars and predators."
    ];

    function showFact() {
      const randomIndex = Math.floor(Math.random() * facts.length);
      document.getElementById("fact").innerText = facts[randomIndex];
    }
  </script>
</body>
</html>
